[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taxlobby"
version = "0.1.0"
description = "Reproducible pipeline for US tax lobbying disclosures (Lobbying Disclosure Act, lda.gov)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lakshmi Menon"}]
dependencies = ["pandas>=2.0", "numpy", "requests", "curl_cffi", "ftfy", "matplotlib", "pyyaml"]

[project.scripts]
taxlobby = "taxlobby.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
